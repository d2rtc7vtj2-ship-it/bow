<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<meta name="color-scheme" content="dark">
<title>Study Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
<script src="topbar.js" defer></script>
<style>
:root {
  --bg: #050506;
  --bg-card: rgba(255, 255, 255, 0.04);
  --border: rgba(255, 255, 255, 0.06);
  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --accent: #6BE3A4;
  --warning: #F2C063;
  --danger: #FF6B6B;
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text-secondary);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-text-size-adjust: 100%;
}
body {
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  overflow-y: scroll;
  scrollbar-gutter: stable;
  padding: max(28px, env(safe-area-inset-top, 28px)) calc(20px + env(safe-area-inset-right, 0px)) 60px calc(20px + env(safe-area-inset-left, 0px));
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(circle at 82% 14%, rgba(224, 118, 88, 0.16), transparent 45%),
    radial-gradient(circle at 18% 90%, rgba(180, 180, 200, 0.06), transparent 50%);
  filter: blur(40px);
  pointer-events: none;
  z-index: -2;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: 3px 3px;
  pointer-events: none;
  z-index: -1;
}

.page {
  max-width: 1100px;
  margin: 0 auto;
  position: relative;
  z-index: 2;
}

.title {
  margin: 0 0 20px;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.025em;
  background: linear-gradient(180deg, #FFFFFF 0%, #C7C4BC 120%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}

.section-title {
  font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--text-tertiary);
  display: flex; align-items: center; gap: 12px;
  margin: 24px 0 14px;
}
.section-title::before {
  content: ''; width: 18px; height: 1px;
  background: var(--text-tertiary); opacity: 0.6;
}
.section-title::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(90deg, rgba(255,255,255,0.08), transparent);
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 14px;
  backdrop-filter: blur(24px) saturate(1.2);
  -webkit-backdrop-filter: blur(24px) saturate(1.2);
  box-shadow: 0 12px 40px rgba(0,0,0,0.45);
}

.timer-display {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  font-size: 48px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  margin-bottom: 16px;
  color: var(--text-primary);
}

.timer-input {
  width: 70px;
  background: transparent;
  border: none;
  color: var(--text-primary);
  font-size: 48px;
  font-weight: 700;
  text-align: center;
  outline: none;
}

.timer-input:focus {
  background: rgba(255, 255, 255, 0.08);
  border-radius: 8px;
}

.timer-colon {
  color: var(--text-secondary);
  line-height: 1;
}

.progress-bar {
  width: 100%;
  height: 6px;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 3px;
  overflow: hidden;
  margin: 16px 0;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  width: 100%;
  border-radius: 3px;
  box-shadow: 0 0 8px rgba(107, 227, 164, 0.4);
  transition: width 1s linear;
}

.timer-controls {
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
}

button {
  border: none;
  background: none;
  color: inherit;
  font-family: inherit;
  cursor: pointer;
  transition: 0.15s ease;
}

.btn-primary {
  background: linear-gradient(180deg, #FFFFFF 0%, #E8E5DD 100%);
  color: #0A0A0B;
  padding: 9px 18px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 2px 8px rgba(0,0,0,0.35), 0 8px 22px rgba(0,0,0,0.25);
}

.btn-primary:hover {
  filter: brightness(1.06);
  transform: translateY(-1px);
}

.btn-primary:active {
  transform: translateY(0);
}

.btn-secondary {
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid rgba(255, 255, 255, 0.06);
  color: var(--text-secondary);
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 500;
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.12);
  color: var(--text-primary);
}

.presets {
  display: flex;
  gap: 8px;
  margin-top: 14px;
  justify-content: center;
  flex-wrap: wrap;
}

.preset {
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid rgba(255, 255, 255, 0.06);
  color: var(--text-secondary);
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}

.preset:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.12);
  color: var(--text-primary);
}

input[type="text"], input[type="number"] {
  background: rgba(0, 0, 0, 0.28);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: var(--text-primary);
  padding: 9px 12px;
  border-radius: 10px;
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s;
  font-family: inherit;
}

input[type="text"]:focus, input[type="number"]:focus {
  border-color: rgba(255, 255, 255, 0.18);
  background: rgba(0, 0, 0, 0.36);
}

input::placeholder {
  color: var(--text-tertiary);
}

.task-input {
  width: 100%;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
  padding: 0 0 12px 0;
  margin-bottom: 12px;
  outline: none;
}

.task-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 12px;
  margin-bottom: 6px;
  transition: all 0.15s ease;
}

.task-row:hover {
  border-color: rgba(255, 255, 255, 0.12);
}

.task-row.done {
  opacity: 0.45;
  background: rgba(107, 227, 164, 0.04);
}

.task-row.done .task-text {
  text-decoration: line-through;
  text-decoration-color: rgba(255, 255, 255, 0.4);
}

input[type="checkbox"] {
  appearance: none;
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  border: 1.5px solid rgba(255, 255, 255, 0.18);
  background: rgba(0, 0, 0, 0.28);
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s ease;
  flex-shrink: 0;
}

input[type="checkbox"]:checked {
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 12px rgba(107, 227, 164, 0.4);
}

.task-text {
  flex: 1;
  font-size: 14px;
  color: var(--text-primary);
}

.task-delete {
  color: var(--text-tertiary);
  font-size: 16px;
  padding: 4px 6px;
  opacity: 0;
  transition: opacity 0.15s ease;
}

.task-row:hover .task-delete {
  opacity: 1;
}

.task-delete:hover {
  color: var(--danger);
}

.empty-state {
  text-align: center;
  padding: 28px 12px;
  color: var(--text-tertiary);
  font-size: 13px;
}

@media (max-width: 480px) {
  body { padding: max(20px, env(safe-area-inset-top, 20px)) calc(14px + env(safe-area-inset-right, 0px)) 50px calc(14px + env(safe-area-inset-left, 0px)); }
  .title { font-size: 22px; }
  .timer-display { font-size: 36px; }
  .timer-input { font-size: 36px; width: 50px; }
  .card { padding: 16px; }
}
</style>
</head>
<body>
<div class="page">
  <h1 class="title">Study</h1>

  <div class="section-title">Timer</div>
  <div class="card">
    <div class="timer-display">
      <input type="number" id="timerH" class="timer-input" value="00" min="0" max="99">
      <span class="timer-colon">:</span>
      <input type="number" id="timerM" class="timer-input" value="25" min="0" max="59">
      <span class="timer-colon">:</span>
      <input type="number" id="timerS" class="timer-input" value="00" min="0" max="59">
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="timer-controls">
      <button class="btn-primary" id="btnStart">▶ Start</button>
      <button class="btn-secondary" id="btnReset">Reset</button>
    </div>
    <div class="presets">
      <button class="preset" data-mins="25">25 min</button>
      <button class="preset" data-mins="45">45 min</button>
      <button class="preset" data-mins="60">60 min</button>
      <button class="preset" data-mins="90">90 min</button>
    </div>
  </div>

  <div class="section-title">Tasks</div>
  <div class="card">
    <input type="text" id="taskInput" class="task-input" placeholder="Add a task..." autocomplete="off">
    <button class="btn-primary" id="btnAddTask" style="width: 100%; margin-top: 0;">+ Add Task</button>
    <div id="taskList" style="margin-top: 14px;"></div>
    <div id="emptyState" class="empty-state">No tasks yet — add one to get started.</div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ===== TIMER =====
  const timerH = document.getElementById('timerH');
  const timerM = document.getElementById('timerM');
  const timerS = document.getElementById('timerS');
  const progressFill = document.getElementById('progressFill');
  const btnStart = document.getElementById('btnStart');
  const btnReset = document.getElementById('btnReset');

  let timerInterval = null;
  let isRunning = false;
  let totalSeconds = 25 * 60;
  let remainingSeconds = 25 * 60;

  function updateDisplay() {
    const h = Math.floor(remainingSeconds / 3600);
    const m = Math.floor((remainingSeconds % 3600) / 60);
    const s = remainingSeconds % 60;
    timerH.value = String(h).padStart(2, '0');
    timerM.value = String(m).padStart(2, '0');
    timerS.value = String(s).padStart(2, '0');
    progressFill.style.width = ((totalSeconds - remainingSeconds) / totalSeconds * 100) + '%';
  }

  function setTimer(mins) {
    totalSeconds = mins * 60;
    remainingSeconds = totalSeconds;
    updateDisplay();
  }

  btnStart.addEventListener('click', () => {
    if (isRunning) {
      clearInterval(timerInterval);
      isRunning = false;
      btnStart.textContent = '▶ Start';
      btnStart.style.opacity = '1';
      return;
    }

    totalSeconds = parseInt(timerH.value) * 3600 + parseInt(timerM.value) * 60 + parseInt(timerS.value);
    if (totalSeconds <= 0) return;
    remainingSeconds = totalSeconds;
    isRunning = true;
    btnStart.textContent = '⏸ Pause';
    btnStart.style.opacity = '0.7';

    timerInterval = setInterval(() => {
      remainingSeconds--;
      updateDisplay();
      if (remainingSeconds <= 0) {
        clearInterval(timerInterval);
        isRunning = false;
        btnStart.textContent = '▶ Start';
        btnStart.style.opacity = '1';
        remainingSeconds = 0;
      }
    }, 1000);
  });

  btnReset.addEventListener('click', () => {
    clearInterval(timerInterval);
    isRunning = false;
    btnStart.textContent = '▶ Start';
    btnStart.style.opacity = '1';
    setTimer(25);
  });

  document.querySelectorAll('.preset').forEach(btn => {
    btn.addEventListener('click', () => {
      clearInterval(timerInterval);
      isRunning = false;
      btnStart.textContent = '▶ Start';
      btnStart.style.opacity = '1';
      setTimer(parseInt(btn.dataset.mins));
    });
  });

  // ===== TASKS =====
  const taskInput = document.getElementById('taskInput');
  const btnAddTask = document.getElementById('btnAddTask');
  const taskList = document.getElementById('taskList');
  const emptyState = document.getElementById('emptyState');

  function getStorageKey() {
    return 'study_tasks_' + new Date().toISOString().split('T')[0];
  }

  function getTasks() {
    try {
      const tasks = localStorage.getItem(getStorageKey());
      return tasks ? JSON.parse(tasks) : [];
    } catch (e) {
      return [];
    }
  }

  function setTasks(tasks) {
    localStorage.setItem(getStorageKey(), JSON.stringify(tasks));
  }

  function renderTasks() {
    const tasks = getTasks();
    taskList.innerHTML = '';
    emptyState.style.display = tasks.length === 0 ? 'block' : 'none';

    tasks.forEach((task, idx) => {
      const row = document.createElement('div');
      row.className = 'task-row' + (task.done ? ' done' : '');

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = task.done;
      cb.addEventListener('change', () => {
        tasks[idx].done = cb.checked;
        setTasks(tasks);
        renderTasks();
      });

      const text = document.createElement('span');
      text.className = 'task-text';
      text.textContent = task.text;

      const del = document.createElement('button');
      del.className = 'task-delete';
      del.textContent = '×';
      del.addEventListener('click', () => {
        tasks.splice(idx, 1);
        setTasks(tasks);
        renderTasks();
      });

      row.appendChild(cb);
      row.appendChild(text);
      row.appendChild(del);
      taskList.appendChild(row);
    });
  }

  btnAddTask.addEventListener('click', () => {
    const text = taskInput.value.trim();
    if (!text) return;
    const tasks = getTasks();
    tasks.push({ text, done: false });
    setTasks(tasks);
    taskInput.value = '';
    renderTasks();
  });

  taskInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      btnAddTask.click();
    }
  });

  // Initialize
  updateDisplay();
  renderTasks();
})();
</script>
</body>
</html>
